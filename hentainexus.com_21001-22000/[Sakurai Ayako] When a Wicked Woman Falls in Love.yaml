Title: When a Wicked Woman Falls in Love
Artist:
- Sakurai Ayako
Description: "Reina learned the reality of the world in the cruelest way when she was used and tossed aside by an older woman. She vowed never to let it happen again. She fashioned herself into the perfect seductress, preying on virgins and leaving a trail of broken hearts in her wake, becoming hooked on the feeling of hurting others the way she\u2019d once been hurt. Who could ever make such a damaged heart whole again?Artist StatementIt took me 5 years to complete the \"When a Wicked Woman Falls in Love\" series. The doujin's popularity led to it getting a second wind in commercial release as well. Thank you so much for all your support. There's a lot of things in this story that can only be shown in the doujin version so I hope you enjoy it!"
